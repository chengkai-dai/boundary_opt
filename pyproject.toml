[project]
name = "clean-boundary-opt"
version = "0.1.0"
description = "Differentiable four-parameter harmonic boundary optimization on triangle meshes"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
]

[project.optional-dependencies]
visualization = ["polyscope>=2.6.1,<3"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
